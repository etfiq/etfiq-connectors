# Publishes one package to PyPI through trusted publishing: no token is stored anywhere.
# Run it by hand (Actions > Publish to PyPI > Run workflow) and pick the package.
name: Publish to PyPI
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package folder
        required: true
        type: choice
        options: [openbb-etfiq, langchain-etfiq, llama-index-tools-etfiq]
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build ${{ inputs.package }}
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ inputs.package }}/dist/
