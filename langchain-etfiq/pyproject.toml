[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-etfiq"
version = "0.1.0"
description = "LangChain tools for ETFIQ's free, keyless ETF data: search, profile, holdings, flows, compare and screen."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "ETFIQ", email = "data@etfiq.com" }]
keywords = ["langchain", "etf", "finance", "tools", "etfiq"]
dependencies = ["langchain-core>=0.3.0"]

[project.optional-dependencies]
test = ["pytest", "langchain-tests>=0.3.0"]

[project.urls]
Homepage = "https://etfiq.com"
Source = "https://github.com/etfiq/etfiq-connectors/tree/main/langchain-etfiq"
Data = "https://etfiq.com/data/"

[tool.hatch.build.targets.wheel]
packages = ["langchain_etfiq"]
